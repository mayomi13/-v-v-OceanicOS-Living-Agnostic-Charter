version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
    environment:
      - NODE_ENV=development
  frontend:
    working_dir: /app/frontend
    image: node:18
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
    command: sh -c "cd frontend && npm install --silent && npm run dev -- --host 0.0.0.0"
