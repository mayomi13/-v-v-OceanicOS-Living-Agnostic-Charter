version: '3.8'

services:
  backend:
    image: vovv-backend:0.1.0
    container_name: vovv-backend-prod
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
      LOG_LEVEL: info
      HOST: "0.0.0.0"
      PORT: "3000"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - vovv-network
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: vovv-frontend:0.1.0
    container_name: vovv-frontend-prod
    ports:
      - "80:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL}
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - vovv-network
    depends_on:
      - backend

  db:
    image: postgres:15
    container_name: vovv-db-prod
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: vovv_prod
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vovv-network
    # Note: For production, use managed PostgreSQL (AWS RDS, GCP Cloud SQL, etc.)
    # This is kept for reference only

volumes:
  db-data:
    driver: local

networks:
  vovv-network:
    driver: bridge
