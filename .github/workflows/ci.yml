name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vovv
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: 'npm'
      - name: Install workspace dependencies
        run: npm ci --include=workspaces
      - name: Run Prisma migrations
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/vovv?schema=public"
        run: npx prisma migrate deploy
      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/vovv?schema=public"
        run: npm run test
      - name: Build backend
        run: |
          cd backend
          npm run build
      - name: Build frontend
        run: |
          cd frontend
          npm run build
      - name: Lint (super-linter)
        uses: github/super-linter@v5
        env:
          VALIDATE_MARKDOWN: true
          DEFAULT_BRANCH: main
