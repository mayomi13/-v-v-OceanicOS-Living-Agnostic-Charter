name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - name: Install workspace dependencies
        run: npm ci --include=workspaces
      - name: Build backend
        run: |
          cd backend
          npm run build
      - name: Build frontend
        run: |
          cd frontend
          npm run build
      - name: Lint (super-linter)
        uses: github/super-linter@v5
        env:
          VALIDATE_MARKDOWN: true
          DEFAULT_BRANCH: main
